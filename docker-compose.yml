version: "3.8"

services:

  # ─────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: airline_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: airline_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Spring Boot Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./airline-management-system
      dockerfile: Dockerfile.backend
    container_name: airline_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-make-it-long
      JWT_EXPIRATION: 86400000
      ADMIN_DEFAULT_EMAIL: admin@airline.com
      ADMIN_DEFAULT_PASSWORD: Admin@123
    depends_on:
      mysql:
        condition: service_healthy

  # ─────────────────────────────────────────
  # React Frontend (served by Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./airline-frontend
      dockerfile: Dockerfile.frontend
    container_name: airline_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
